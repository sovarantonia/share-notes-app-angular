<h2 mat-dialog-title>Share note</h2>
<mat-dialog-content>
  <app-simple-autocomplete [options]="data" (optionSelected)="onUserSelected($event)" />
</mat-dialog-content>

<mat-dialog-actions>
  <button matButton (click)="onShare()">Share</button>
  <button matButton mat-dialog-close>Close</button>
</mat-dialog-actions>
